version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-runtime:
        patterns:
          - numpy
          - Pillow
          - opencv-python-headless
      python-development:
        dependency-type: development
        patterns:
          - "*"
    ignore:
      # Explicit version ranges also block constraint-widening PRs. Major numerical/vision
      # releases require a compatibility sprint before the public runtime range is widened.
      - dependency-name: numpy
        versions:
          - ">=3"
      - dependency-name: opencv-python-headless
        versions:
          - ">=5"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
